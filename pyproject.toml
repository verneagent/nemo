[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "captain-nemo"
version = "0.4.58"
description = "Lark-connected coding agent daemon powered by Claude Agent SDK"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "Verne"}]
keywords = ["lark", "feishu", "agent", "claude", "coding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "claude-agent-sdk>=0.1.50,<0.1.56",
  "lark-oapi>=1.3.0",
  "pyyaml>=6.0",
  "websockets>=15.0",
  # pyte: terminal emulator used by the claude-cli (pty-driven TUI) adapter
  # to maintain a stable screen buffer for scraping turn output.
  "pyte>=0.8.2",
]

[project.urls]
Repository = "https://github.com/verneagent/nemo"

[project.scripts]
nemo = "nemo.__main__:main"
nemo-send = "nemo.send:main"
nemo-vision = "nemo.vision_cli:main"

[tool.setuptools.packages.find]
include = ["nemo*"]

[tool.setuptools.package-data]
nemo = [
  "assets/*.png",
  "codex_sidecar/package.json",
  "codex_sidecar/package-lock.json",
  "codex_sidecar/run_turn.mjs",
  "codex_sidecar/resume.mjs",
  "opencode_sidecar/package.json",
  "opencode_sidecar/list_models.mjs",
  "opencode_sidecar/run_turn.mjs",
]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "realsdk: hits the real Claude SDK/CLI (needs auth); run with NEMO_REAL_SDK=1",
]
addopts = "--ignore=tests/test_main.py --ignore=tests/test_relay_events.py --ignore=relay/"
