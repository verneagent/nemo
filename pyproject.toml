[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "captain-nemo"
version = "0.3.11"
description = "Lark-connected coding agent daemon powered by Claude Agent SDK"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Verne"}]
keywords = ["lark", "feishu", "agent", "claude", "coding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "claude-agent-sdk",
  "lark-oapi>=1.3.0",
  "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/verneagent/nemo"

[project.scripts]
nemo = "nemo.__main__:main"

[tool.setuptools.packages.find]
include = ["nemo*"]
